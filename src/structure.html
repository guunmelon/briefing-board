<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI 브리핑 보드 — 1차 프로토타입</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body data-sim="1">

<!-- ============ SVG 아이콘 스프라이트 ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 15h2M14 15h2M8 18h2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2.2 3.5L17 11H5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 16.9 6.4 20l1.3-6.2L3 9.5l6.3-.7z"/></symbol>
    <symbol id="i-mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5C7 16.5 3 13 3 8.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 9 2.8C21 13 17 16.5 12 20.5Z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9Z"/><path d="M10 19a2.2 2.2 0 0 0 4 0"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></symbol>
    <symbol id="i-bars" viewBox="0 0 24 24"><path d="M5 12h2M11 12h8M5 18h2M11 18h8M5 6h2M11 6h8"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 5V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-1"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2.5-7.5Z"/><path d="M10.5 13.5 21 3"/></symbol>
    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 8h9.5a2.5 2.5 0 1 0-2.5-2.5"/><path d="M3 12h13a2.8 2.8 0 1 1-2.8 2.8"/><path d="M3 16h6.5a2 2 0 1 1-2 2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.2 6 10.6a6 6 0 1 1-12 0C6 9.2 12 3 12 3Z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 3v13M9 21l3-3 3 3M8 8l-3 2 7 4 7-4-3-2"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2c.6 4.7 2.4 6.5 7 7-4.6.5-6.4 2.3-7 7-.6-4.7-2.4-6.5-7-7 4.6-.5 6.4-2.3 7-7Z"/><path d="M19 15c.3 2 1.2 2.8 3 3-1.8.3-2.7 1.1-3 3-.3-1.9-1.2-2.7-3-3 1.8-.2 2.7-1 3-3Z"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M20 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3v4h-4"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-loc" viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></symbol>
    <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M17 8h1a3 3 0 0 1 0 6h-1"/><path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5Z"/><path d="M8 2v2M12 2v2M16 2v2"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2.3-3A8 8 0 1 1 21 12Z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2c.9 3.1-.8 4.9-2.3 6.5C8.2 10.1 7 11.8 7 14.5A5 5 0 0 0 17 14.5c0-1.6-.6-2.8-1.5-4-.4 1-.9 1.6-1.6 2C14.4 10 13.7 5.6 12 2Z"/></symbol>
    <symbol id="i-write" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
  </defs>
</svg>

<!-- ============ 가상 데스크톱 (배경) ============ -->
<div id="desktop" aria-hidden="true">
  <div class="wall"></div>
  <!-- 시간대별 하늘 (일출/낮/노을/황혼/밤) + 기상경보용 비·번개 -->
  <div class="sky" id="sky"><div class="grad"></div><div class="orb"></div></div>
  <div class="rain-layer" id="rainLayer" aria-hidden="true"></div>
  <div class="flash" aria-hidden="true"></div>
  <!-- 경보 전용 추가 FX 레이어 (황사 연무/대설 눈 등 — 보드 뒤 배경) -->
  <div class="fx-behind" id="fxBehind" aria-hidden="true"></div>
  <div class="dt-icon" style="left:3.2%; top:11%;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fde047" stroke-width="1.7" stroke-linecap="round"><path d="m12 3 2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 16.9 6.4 20l1.3-6.2L3 9.5l6.3-.7z"/></svg><small>브리핑 보드</small></div>
  <div class="dt-icon" style="left:3.2%; top:23%;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg><small>메일</small></div>
  <div class="dt-icon" style="left:3.2%; top:35%;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><small>일정</small></div>
</div>

<!-- ============ AI 브리핑 보드 ============ -->
<main id="board" class="glass" aria-label="AI 브리핑 보드">
  <div class="grab-hint">우하단 핸들로 크기를 조절할 수 있어요 (위치는 항상 중앙)</div>
  <!-- 경보 전용 보드 프레임 FX (한파 고드름 등 — 위젯 위 얇은 오버레이) -->
  <div class="board-fx" id="boardFx" aria-hidden="true"></div>

  <!-- 헤더 -->
  <header class="board-head" id="boardHead">
    <div class="brand">
      <div class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2c.6 4.7 2.4 6.5 7 7-4.6.5-6.4 2.3-7 7-.6-4.7-2.4-6.5-7-7 4.6-.5 6.4-2.3 7-7Z"/><path d="M19 15c.3 2 1.2 2.8 3 3-1.8.3-2.7 1.1-3 3-.3-1.9-1.2-2.7-3-3 1.8-.2 2.7-1 3-3Z"/></svg></div>
      <div>
        <h1>AI 브리핑 보드 <span class="live-dot"><i></i>브리핑 중</span></h1>
        <p id="headSub">관심사를 "편집"하는 나만의 브리핑 에디터 · iCloud 일정 연동</p>
      </div>
    </div>
    <div class="head-actions">
      <button class="chip" id="btnTopicsManage" title="관심사 관리">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h2M11 12h8M5 18h2M11 18h8M5 6h2M11 6h8"/></svg>
        내 관심사 <span id="topicCount" class="mini-badge" style="background:rgba(99,102,241,.14);color:var(--accent1)">3</span>
      </button>
      <button class="chip" id="btnRefresh" title="데이터 새로고침">
        <svg id="refreshIco" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3v4h-4"/></svg>
        새로고침
      </button>
      <button class="chip" id="btnSettings" title="설정">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></symbol></svg>
      </button>
      <button class="icon-btn accent" id="btnFull" title="전체화면/창 모드 전환">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 5V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-1"/></svg>
      </button>
    </div>
  </header>

  <!-- 위젯 3개 -->
  <section id="grid" data-layout="today-hero">

    <!-- ① 오늘 일정 위젯 -->
    <article class="wd hero" style="--a:today;" data-w="today">
      <div class="wd-head">
        <div class="wd-dot" style="--wd-c1:#6366f1;--wd-c2:#06b6d4"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
        <div style="min-width:0">
          <div class="wd-title">오늘 일정 <span class="tag-pill" id="dayTag" style="background:rgba(99,102,241,.14);color:#7c7ef0;">월</span></div>
          <div class="wd-sub" id="todaySub">iCloud 캘린더와 동기화됨</div>
        </div>
        <div class="wd-acts">
          <span class="linkmini" id="schedSync">iCloud 일정 연결</span>
        </div>
      </div>
      <div class="wd-body">
        <div class="greet" id="greetBox">
          <div style="min-width:0">
            <h2 id="greetMsg">좋은 아침이에요, 민준 님</h2>
            <div class="today-sub" id="weatherLine"></div>
          </div>
          <div class="temp" style="flex-direction:column;align-items:flex-end;gap:0">
            <div style="display:flex;align-items:center;gap:6px">
              <svg id="wxIco" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--accent1)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <b id="wxTemp">23°</b>
            </div>
            <span class="wx-chip" id="wxChip" style="margin-top:3px">서울</span>
            <span class="wx-strip" id="wxStrip"></span>
          </div>
        </div>
        <div id="nextCard"></div>
        <div class="wd-scroll">
          <div class="sched-h">
            <span class="kicker">오늘 일정</span>
            <button class="linkmini" id="btnAddEvent" style="border-radius:999px">+ 일정 추가</button>
          </div>
          <div id="todaySchedule"></div>
        </div>
      </div>
    </article>

    <!-- ② 관심사 현황 (현황 카드 전용 — 뉴스는 아래 브리핑에서) -->
    <article class="wd" style="--a:topics;" data-w="topics">
      <div class="wd-head">
        <div class="wd-dot" style="--wd-c1:#8b5cf6;--wd-c2:#ec4899"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m12 3 2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 16.9 6.4 20l1.3-6.2L3 9.5l6.3-.7z"/></svg></div>
        <div>
          <div class="wd-title">관심사 현황</div>
          <div class="wd-sub">등록 관심사의 실제 소식 · 숫자형 카드는 소스 연결 후 표시</div>
        </div>
        <div class="wd-acts">
          <button class="linkmini" id="btnTopicsHeight" title="세로 크기 확장/축소">크기 조절</button>
          <button class="linkmini" id="btnTopicAdd">+ 관심사 추가</button>
        </div>
      </div>
      <div class="wd-body">
        <div id="topicTiles"></div>
      </div>
    </article>

    <!-- ③ TODAY'S BRIEFING (편집자 컨셉) -->
    <article class="wd" style="--a:news;" data-w="news">
      <div class="wd-head">
        <div class="wd-dot" style="--wd-c1:#f59e0b;--wd-c2:#ef4444"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></div>
        <div style="min-width:0">
          <div class="wd-title">TODAY'S BRIEFING <span id="newsCount" class="mini-badge" style="background:rgba(245,158,11,.15);color:#d97706;">3</span></div>
        </div>
        <div class="wd-acts">
          <button class="linkmini" id="btnNewsHeight" title="세로 크기 확장/축소">크기 조절</button>
          <button class="linkmini" id="btnNewsReload">다시 편집하기</button>
        </div>
      </div>
      <div class="wd-body" style="gap:7px">
        <div class="brief-bar">
          <span class="brief-meta-top" id="briefMeta">편집자가 골랐어요…</span>
          <div class="rail-nav">
            <button class="rail-btn" id="railPrev" title="이전">&lsaquo;</button>
            <button class="rail-btn" id="railNext" title="다음">&rsaquo;</button>
          </div>
        </div>
        <div class="brief-rail" id="briefRail"></div>
      </div>
    </article>
  </section>

  <!-- 피드백 반영 받기 (버튼 → 클릭하면 챗바가 확장) -->
  <footer class="fbzone" id="fbRoot">
    <button class="undo-chip" id="undoChip" type="button">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      방금 변경을 되돌리기
    </button>
    <button class="fb-pill" id="fbPill" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2c.6 4.7 2.4 6.5 7 7-4.6.5-6.4 2.3-7 7-.6-4.7-2.4-6.5-7-7 4.6-.5 6.4-2.3 7-7Z"/></svg>
      <span>피드백 반영 받기</span>
    </button>
    <div class="fb-frame" id="fbFrame">
      <div class="fb-ring"></div>
      <div class="fb-inner">
        <div class="fb-bar">
          <span class="fb-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H4l2.3-3A8 8 0 1 1 21 12Z"/></svg></span>
          <input id="fbInput" placeholder="원하는 모양을 말해보세요 — 예: 주식은 초록이 상승, AI를 맨 위에…" autocomplete="off"/>
          <button class="feedback-send" id="fbSend" type="button">
            <span id="fbSendLabel">반영 요청</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-8-8 18-2.5-7.5Z"/><path d="M10.5 13.5 21 3"/></svg>
          </button>
          <button class="fb-x" id="fbClose" type="button" title="접기">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
        <div class="fb-logrow">
          <div class="fb-chips" id="fbHints"></div>
          <div class="fb-patchfoot" id="fbPatchFoot"></div>
          <div class="fb-aistat" id="aiLogHint">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2c.6 4.7 2.4 6.5 7 7-4.6.5-6.4 2.3-7 7-.6-4.7-2.4-6.5-7-7 4.6-.5 6.4-2.3 7-7Z"/></svg>
            <span id="aiLogText" class="typing"></span>
          </div>
        </div>
      </div>
    </div>
  </footer>
</main>

<!-- ============ 태스크바 (시뮬레이션) ============ -->
<div id="taskbar">
  <button class="tb-start" title="시작">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="2.5" y="2.5" width="8.5" height="8.5" rx="1.6"/><rect x="13" y="2.5" width="8.5" height="8.5" rx="1.6"/><rect x="2.5" y="13" width="8.5" height="8.5" rx="1.6"/><rect x="13" y="13" width="8.5" height="8.5" rx="1.6" opacity=".85"/></svg>
  </button>
  <div class="tb-center">
    <button class="tb-ic" id="tbStartBtn" title="브리핑 보드 열기">
