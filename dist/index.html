.live-tag{ font-size:9.5px; font-weight:800; color:#fff; background:linear-gradient(135deg,#ef4444,#f97316);
  border-radius:99px; padding:1.5px 7px; margin-left:auto; }
.brief.is-sport.is-live{ box-shadow:0 0 0 1px rgba(239,68,68,.35), 0 10px 26px -18px rgba(239,68,68,.5); }
.fb-patchfoot{ display:flex; align-items:center; gap:6px; margin-left:auto; }
.fb-patchfoot .patch{ font-size:10.5px; }
.fb-patchfoot .patch b{ color:var(--good); }

.sky-live{ display:flex; flex-direction:column; gap:3px; margin:2px 2px 6px; padding:7px 9px;
  border-radius:10px; background:var(--glass-weak); border:1px solid var(--line-weak); }
.sky-live .sl-line{ font-size:10.5px; line-height:1.6; color:var(--ink-2); display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
.sky-live .sl-on{ color:#38bdf8; font-weight:800; }
.wx-strip{ display:block; margin-top:5px; }
.wx-strip .bp-split{ margin-top:0 }
.wx-strip:empty{ display:none }

/* ===== 스포츠 명예의 전당 (1위 / 우승 / 최다득점 / MVP) & F1 세션 ===== */
.sport-honor-strip{ display:flex; align-items:center; gap:5px; margin:4px 0 3px; padding:3px 7px; border-radius:8px; background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(234,179,8,.08)); border:1px solid rgba(234,179,8,.25); font-size:10.5px; line-height:1.4; flex-wrap:wrap; }
.sport-honor-strip .sh-tag{ font-size:9px; font-weight:800; padding:1px 5px; border-radius:99px; background:linear-gradient(135deg,#f59e0b,#eab308); color:#000; letter-spacing:.02em; white-space:nowrap; }
.sport-honor-strip .sh-name{ font-weight:750; color:var(--ink); }
.sport-honor-strip .sh-val{ font-weight:800; color:#3b82f6; }
.sport-honor-strip .sh-sub{ font-size:9.5px; color:var(--ink-3); }

.sess-row{ display:flex; gap:4px; flex-wrap:wrap; margin:3px 0 2px; }
.sess-chip{ font-size:9.5px; padding:2px 6px; border-radius:6px; background:var(--glass-weak); border:1px solid var(--line-weak); color:var(--ink-2); white-space:nowrap; }
.sess-chip b{ color:var(--ink); margin-right:3px; }

@keyframes spin-inf{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
.tile-refresh.spinning svg{ animation:spin-inf .65s linear infinite; }

/* ===== 위젯 세로 크기 조절 (관심사 & 뉴스레터) ===== */
.wd{ position:relative; }
.wd-v-handle{ position:absolute; left:0; right:0; bottom:0; height:12px; cursor:ns-resize; z-index:10; display:flex; align-items:center; justify-content:center; opacity:.35; transition:opacity .2s, background .2s; }
.wd-v-handle:hover, .wd-v-handle:active{ opacity:1; background:rgba(99,102,241,.08); }
.wd-v-handle .v-grip{ width:42px; height:3.5px; border-radius:99px; background:var(--ink-3); box-shadow:0 1px 2px rgba(0,0,0,.15); }
body.resizing-v{ cursor:ns-resize !important; user-select:none; }

.mlist{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:9px; align-items:start; }
.wd[data-w="topics"] .wd-body{ max-height:none; }
.wd[data-w="news"] .wd-body{ max-height:none; }

/* ===== 아이폰 스타일 관심사 드래그 앤 드롭 ===== */
.tile-drag-handle {
  width: 16px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-3);
  cursor: grab;
  margin-right: 3px;
  opacity: 0.45;
  transition: opacity 0.2s, color 0.2s;
  touch-action: none;
  user-select: none;
  flex: 0 0 auto;
}
.tile:hover .tile-drag-handle {
  opacity: 0.95;
  color: var(--ink);
}
.tile {
  touch-action: pan-y;
  user-select: none;
  transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.22s var(--ease), opacity 0.2s;
  position: relative;
}

/* iOS Jiggle / Wiggle Mode */
@keyframes iosWiggle {
  0% { transform: rotate(-0.55deg) scale(0.995); }
  50% { transform: rotate(0.55deg) scale(1.002); }
  100% { transform: rotate(-0.55deg) scale(0.995); }
}
.mlist.is-reordering .tile:not(.is-dragging) {
  animation: iosWiggle 0.26s ease-in-out infinite alternate;
  cursor: grab;
}

/* Dragging tile state (iOS Lifted Floating Card) */
.tile.is-dragging {
  position: fixed !important;
  z-index: 10000 !important;
  pointer-events: none !important;
  transform: scale(1.05) translateY(-4px) rotate(1.2deg) !important;
  box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.45), 0 0 0 2px var(--accent1), 0 0 20px rgba(99, 102, 241, 0.35) !important;
  opacity: 0.96 !important;
  cursor: grabbing !important;
  transition: none !important;
  will-change: transform, left, top;
}

/* Drop Placeholder Slot */
.tile-placeholder {
  border: 2px dashed rgba(99, 102, 241, 0.6);
  background: rgba(99, 102, 241, 0.08);
  border-radius: var(--r-md);
  min-height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-sizing: border-box;
}
.tile-placeholder::after {
  content: "여기로 이동";
  font-size: 11px;
  font-weight: 700;
  color: var(--accent1);
  letter-spacing: 0.04em;
  opacity: 0.85;
}

/* Rowitem drag handle in manage modal */
.row-drag-handle {
  width: 22px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-3);
  cursor: grab;
  opacity: 0.45;
  transition: opacity 0.2s;
  touch-action: none;
  flex: 0 0 auto;
}
.rowitem:hover .row-drag-handle {
  opacity: 0.95;
  color: var(--ink);
}
.rowitem {
  transition: transform 0.2s, background 0.2s;
  user-select: none;
}
.rowitem.is-dragging {
  opacity: 0.55;
  background: rgba(99, 102, 241, 0.12);
  border: 1px dashed var(--accent1);
}

</style>

<script>
/* ============================================================
   Store — 로컬 저장 추상화
   - 데모(브라우저 파일)에서는 localStorage
   - 실제 Windows 위젯 앱에서는 이 계층을 파일/전역 스토리지로 교체
   (또는 아래 FORCE_DEFAULTS=true 로 두면 항상 초기 시드로 시작)
   ============================================================ */
(function (global) {
  'use strict';

  const KEY = 'aibrief.board.v3';   // v3: 실데이터 우선(가짜 시드 제거) — 데모 모드 OFF 기본, 취향(good!) 저장
  const FORCE_DEFAULTS = false; // true 로 바꾸면 매번 기본 상태로 시작(개발용)

  const defaults = {
    version: 1,
    userName: '민준',               // 휴대폰 연락처에 표시된 사용자 이름
    timeFormat: '12',
    autoTheme: true,
    demoMode: false,                // 기본 OFF — 실데이터 우선. 켜면 데모 시드 일정/숫자 미리보기
    themeOverride: null,            // 'light' | 'dark' | null(auto)
    layout: 'today-hero',           // AI가 정한 위젯 배치
    topicFocus: 'KR',               // 뉴스 검색 국가
    topics: [],
    aiCfg: {},                      // 위젯별 사용자 확정 설정 {topicId:{...}}
    boardPos: null,                 // 창 위치
    boardSize: null,                // 창 크기
    latestTopicEditor: [],          // 마지막 AI 토픽 에디터 스냅샷(되돌리기용)
    lastFeedback: null,
    readIds: [],                   // good! 로 읽은 기사 키(tid|id) — 같은 관심사의 다음 뉴시를 부르는 기준
  };

  function loadRaw() {
    try {
      const s = localStorage.getItem(KEY);
      return s ? JSON.parse(s) : null;
    } catch (e) { return null; }
  }

  global.BStore = {
    KEY: KEY,
    FORCE_DEFAULTS: FORCE_DEFAULTS,

    load() {
      const raw = loadRaw();
      if (FORCE_DEFAULTS || !raw) return JSON.parse(JSON.stringify(defaults));
      const d = JSON.parse(JSON.stringify(defaults));
      return Object.assign(d, raw, { version: 1 });
    },

    save(state) {
      try { localStorage.setItem(KEY, JSON.stringify(state)); }
      catch (e) { /* 데모 제약 무시 */ }
    },

    reset() { try { localStorage.removeItem(KEY); } catch (e) {} },

    clone(state) { return JSON.parse(JSON.stringify(state)); },
  };
})(window);

</script>
<script>
/* ============================================================
   PATCH RUNTIME — 자동 생성된 코드 패치(src/patches/*.js)를 실행하는 훅
   ------------------------------------------------------------
   · 피드백 엔진(tools/patch-engine.js)이 생성한 코드는 이 런타임의 register() 만 호출한다.
   · 렌더 데이터(payload)와 렌더 HTML 두 지점에 훅을 제공한다.
   · 패치 하나를 못 읽어board가 깨지면 안 된다 → 모든 fn은 try/catch, 실패는 errors 에 남기고 원본을 유지.
   ============================================================ */
(function (global) {
  'use strict';

  const R = { list: [], errors: [], cssDone: false };

  /* ---------- 생성된 코드가 쓰는 공통 헬퍼 ---------- */
  const H = {
    esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
    num(v){
      if (v == null || isNaN(v)) return null;
      const n = Number(v);
      return Math.abs(n) >= 1000 ? Math.round(n).toLocaleString('ko-KR') : (Math.round(n * 10) / 10).toLocaleString('ko-KR');
    },
    money(v){ if (v == null || isNaN(v)) return null; const n = Number(v); return n >= 1e8 ? (n / 1e8).toFixed(1).replace(/\.0$/, '') + '억' : n.toLocaleString('ko-KR'); },
    fx(v){ return v == null || isNaN(v) ? null : Number(v).toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
    /* 대기질 등급 — 환경부/US AQI 구분(판정표는 코드에 인라인으로 남긴다) */
    pmGrade(v){ return v >= 150 ? '매우 나쁨' : v >= 80 ? '나쁨' : v >= 30 ? '보통' : '좋음'; },
    aqiGrade(v){ return v >= 200 ? '매우 나쁨' : v >= 150 ? '나쁨' : v >= 100 ? '민감군 나쁨' : v >= 50 ? '보통' : '좋음'; },
    line(k, v){
      if (v == null || v === '') return '';
      return `<div class="minirow"><span class="k">${H.esc(k)}</span><span class="v">${typeof v === 'number' ? H.num(v) : H.esc(v)}</span></div>`;
    },
    spark(vals, h, color){
      const D = global.Data;
      if (!D || !D.$U || !Array.isArray(vals) || vals.length < 2) return '';
      return D.$U.sparkSvg(vals, 26, h, color || '#38bdf8', color || '#38bdf8', 'bpspark' + Math.round(vals.length * 7 + h));
    },
    shortWhen(w){
      const s = String(w || '');
      return s.replace(/\s*\(.+?\)\s*/, ' ').trim().slice(0, 12);
    },
  };

  /* ---------- 매칭 ---------- */
  /* 스코프: 'tile'(관심사 카드·기본) · 'strip'(오늘 일정 위젯의 날씨 줄) · 'brief'(뉴스레터 카드).
     스코프를 밝히지 않은 패치는 카드·스트립 양쪽에 적용되고 뉴스레터는 명시한 경우에만 적용된다. */
  function matches(target, topic, payload, scope){
    scope = scope || 'tile';
    if (target && target.scope && target.scope !== scope) return false;
    if (!target.scope && scope === 'brief') return false;          // 위치를 안 밝힌 요청은 카드·스트립에만
    if (scope === 'strip' && target.tid) return false;              // 스트립은 특정 카드 지정과 무관
    if (!target.kind && !target.tid) return true;
    if (target.tid && String(topic && topic.id) === String(target.tid)) return true;
    const tk = (topic && topic.kind) || (payload && payload.kind);
    if (scope === 'strip' && target.kind === 'weather') return true;   // 오늘 위젯의 날씨 줄 = 날씨 데이터
    return !!target.kind && tk === target.kind;
  }


  /* ---------- 스타일 주입(css 필드) ---------- */
  function injectCss(){
    if (R.cssDone) return;
    const css = R.list.filter(p => p.css).map(p => `/* ${p.id} */\n${p.css}`).join('\n');
    if (css && global.document && global.document.head){
      const st = global.document.createElement('style');
      st.id = 'bpStyles'; st.textContent = css;
      global.document.head.appendChild(st);
      R.cssDone = true;
    }
  }
  function bump(){
    const doc = global.document;
    if (!doc) return;
    const box = doc.getElementById && doc.getElementById('bpStyles');
    if (box){ R.cssDone = false; box.remove(); injectCss(); }
  }

  function register(p){
    if (!p || !p.id || typeof p.html !== 'function' && typeof p.data !== 'function' && !p.css) return;
    const i = R.list.findIndex(x => x.id === p.id);
    if (i >= 0) R.list.splice(i, 1, p); else R.list.push(p);
    R.cssDone = false; injectCss();
  }

  /* ---------- 데이터 훅(payload → payload) ---------- */
  function applyData(topic, payload, scope){
    if (!payload) return payload;
    let out = payload;
    for (const p of R.list){
      if (typeof p.data !== 'function' || !matches(p.target, topic, out, scope)) continue;
      try { const r = p.data({ payload: out, topic, scope: scope || 'tile', kind: (topic && topic.kind) || out.kind, h: H, now: Date.now() }); if (r) out = r; }
      catch (e){ R.errors.push({ id: p.id, where: 'data', msg: String((e && e.message) || e) }); }
    }
    return out;
  }
  /* ---------- 렌더 훅(html → html) ---------- */
  function applyHtml(topic, payload, html, scope){
    let out = html;
    for (const p of R.list){
      if (typeof p.html !== 'function' || !matches(p.target, topic, payload, scope)) continue;
      try { const r = p.html({ html: out, payload, topic, scope: scope || 'tile', kind: (topic && topic.kind) || (payload && payload.kind), h: H, now: Date.now() }); if (typeof r === 'string') out = r; }
      catch (e){ R.errors.push({ id: p.id, where: 'html', msg: String((e && e.message) || e) }); }
    }
    return out;
  }

  global.BPatch = {
    version: 1,
    register, applyData, applyHtml, bump,
    helpers: H,
    count(){ return R.list.length; },
    errors(){ return R.errors.slice(-6); },
    list(){ return R.list.map(p => ({ id: p.id, title: p.title || p.id, kind: (p.target && p.target.kind) || null, tid: (p.target && p.target.tid) || null, scope: (p.target && p.target.scope) || null, hasData: typeof p.data === 'function', hasHtml: typeof p.html === 'function', hasCss: !!p.css })); },
  };
})(window);

</script>
<script>
/* ============================================================
   DATA — 콘텐츠 엔진 (라이브 우선)
   ─────────────────────────────────────────────────────────────
   원칙: 실데이터가 아니면 "가짜 수치/껍데기"를 만들지 않는다.
   - 관심사 타일·뉴스레터는 실시간 소스(live-server / 네이티브 API)로부터 받은
     payload 를 그대로 그린다. 로딩 중엔 스켈레톤, 서버가 없으면 연결 안내만.
   - 관심사 종류: news(실시간 뉴스) · coin(코인 시세) · stock(주식 시세)
                  · weather(날씨) · personal(개인 상태 — 소스 연결 전 안내)
   - 개인 데이터(운동·건강·습관·프로젝트)는 실소스 연결 전 숫자를 만들지 않고
     진행 게이지 틀 + "연결 필요"만 보여준다.
   ============================================================ */
(function (global) {
  'use strict';

  const $U = {
    pad: n => String(n).padStart(2, '0'),
    fmtKR(n){
      const s = Math.abs(n);
      if (s >= 1e12) return (n / 1e12).toFixed(2).replace(/\.00$/, '') + '조';
      if (s >= 1e8)  return (n / 1e8).toFixed(2).replace(/\.00$/, '') + '억';
      if (s >= 1e4)  return (n / 1e4).toFixed(1).replace(/\.0$/, '') + '만';
      return n.toLocaleString('ko-KR');
    },
    fmt(n){ return n.toLocaleString('ko-KR'); },
    esc(s){ return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); },
    uid(p){ return (p || 'x') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6); },
    clamp(n,a,b){ return Math.min(b, Math.max(a, n)); },
    ago(pub){
      const t = Date.parse(String(pub || ''));
      if (isNaN(t)) return '';
      const m = Math.round((Date.now() - t) / 60000);
      if (m < 1) return '방금';
      if (m < 60) return m + '분';
      const h = Math.round(m / 60);
      if (h < 24) return h + '시간';

    },
    sparkSvg(spark, w, h, c1, c2, id){
      if (!Array.isArray(spark) || spark.length < 2) return '';
      const min = Math.min(...spark), max = Math.max(...spark), rng = (max - min) || 1;
      const pad = rng === 0 ? 2 : 0;
      const lo = min - pad, hi = max + pad;
      const n = spark.length;
      const pts = spark.map((v, i) => `${((i / (n - 1)) * (w - 2) + 1).toFixed(1)},${((h - 2) * (1 - (v - lo) / (hi - lo)) + 1).toFixed(1)}`).join(' ');
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${c1}" stop-opacity=".30"/><stop offset="1" stop-color="${c1}" stop-opacity="0"/>
        </linearGradient></defs>
        <polygon points="0,${h} ${pts} ${w},${h}" fill="url(#${id})"/>

  const esc = $U.esc;

  function todayInfo(now){
    const t = new Date(now);
    return { date: now, ymd:`${t.getFullYear()}. ${t.getMonth()+1}. ${t.getDate()}.`,
      weekday: WEEK_KO[t.getDay()], weekdayLong: WD[t.getDay()],

  }
  function greet(now, events, userName){

    const hello = h < 5 ? '깊은 밤이에요' : h < 11 ? '좋은 아침이에요' : h < 17 ? '안녕하세요' : h < 22 ? '좋은 저녁이에요' : '안녕히 주무세요';
    const nowEv = events.find(e => e.state === 'now');
    const up = events.filter(e => e.state === 'up');
    const done = events.filter(e => e.state === 'done').length;
    let sub;
    if (nowEv) sub = `지금은 <b>${esc(nowEv.title)}</b> 시간이에요.`;
    else if (up.length){
      const next = up[0];
      const mins = Math.round((next.st - now) / 60000);
      sub = `다음 일정 <b>${esc(next.title)}</b> ${mins < 60 ? mins + '분' : (mins / 60).toFixed(1) + '시간'} 전이에요.`;
    } else sub = `오늘 일정은 모두 끝났어요 (${done}건 완료). 편안한 저녁 되세요.`;
    return { hello: `${hello}, ${userName || ''} 님`, sub, dayPart: '', done, total: events.length, up };
  }
  function blockName(now){
    const x = now.getHours() * 60 + now.getMinutes();
    if (x < 9 * 60) return '아침 루틴';
    if (x < 12 * 60) return '오전 업무';
    if (x < 13 * 60) return '점심';
    if (x < 18 * 60) return '오후 업무';
    if (x < 20 * 60) return '저녁 전';
    return '저녁/휴식';
  }
  function buildDemoEvents(now){ return []; }   // 가짜 일정 시드 제거 — 실데이터(iCloud)만

  /* ---------- 관심사 종류 카탈로그 (라이브 대응 5종) ---------- */
  const KIND = {
    news:     { label: '뉴스/트렌드', icon: 'i-mag',  c1: '#f472b6', c2: '#f59e0b', ch: '소식' },
    coin:     { label: '코인 시세',   icon: 'i-spark', c1: '#8b5cf6', c2: '#f472b6', ch: '코인' },
    stock:    { label: '주식 시세',   icon: 'i-bars',  c1: '#f59e0b', c2: '#ef4444', ch: '주식' },
    weather:  { label: '날씨',        icon: 'i-sun',   c1: '#38bdf8', c2: '#818cf8', ch: '날씨' },
    sport:    { label: '스포츠',      icon: 'i-flag',  c1: '#3b82f6', c2: '#22d3ee', ch: '경기' },
    fx:       { label: '환율',        icon: 'i-bars',  c1: '#3b82f6', c2: '#06b6d4', ch: '환율' },
    personal: { label: '개인 상태',   icon: 'i-heart', c1: '#22c55e', c2: '#14b8a6', ch: '개인' },
  };
  const LEGACY_KIND = { crypto:'coin', fitness:'personal', health:'personal', habit:'personal', project:'personal' };
  function normalizeTopic(t){
    const kind = KIND[t.kind] ? t.kind : (LEGACY_KIND[t.kind] || (t.kind ? 'news' : 'news'));
    const o = { id: t.id || $U.uid('t'), label: String(t.label || '주제'), kind, tpl: t.tpl || 'a',
      cfg: t.cfg || {}, interest: t.interest || t.label || '' };
    if (t.key) o.key = t.key;

  }

  /* 기본 관심사 — server(live) 키와 id 를 맞춘다 */
  function defaultTopics(){
    return [
      { id: 'mancity',   key: 'mancity',   label: '맨시티',      kind: 'sport', tpl: 'a', brief: true,  interest: '맨시티 · 프리미어리그 축구' },
      { id: 'bitcoin',   key: 'bitcoin',   label: '비트코인',    kind: 'coin',  tpl: 'a', brief: true,  interest: '비트코인 · 암호화폐' },
      { id: 'minecraft', key: 'minecraft', label: '마인크래프트', kind: 'news', tpl: 'a', brief: true,  interest: '마인크래프트 · 게임' },
      { id: 'birds',     key: 'birds',     label: '조류',        kind: 'news',  tpl: 'a', brief: true,  interest: '조류 · 새 관찰(버드워칭)' },
    ].map(normalizeTopic);
  }

  /* ---------- 카테고리 색상 메타 (카드/뉴스레터 장식) ---------- */
  const CAT_META = {
    sport:   { nm: '스포츠',   c: ['#3b82f6', '#22d3ee'], icon: 'i-flag' },
    crypto:  { nm: '코인',     c: ['#8b5cf6', '#ec4899'], icon: 'i-spark' },
    game:    { nm: '게임',     c: ['#34d399', '#0ea5e9'], icon: 'i-spark' },

    stock:   { nm: '주식',     c: ['#f59e0b', '#ef4444'], icon: 'i-bars' },
    weather: { nm: '날씨',     c: ['#38bdf8', '#818cf8'], icon: 'i-sun' },

    global:  { nm: '글로벌',   c: ['#0ea5e9', '#6366f1'], icon: 'i-open' },
    personal:{ nm: '개인',     c: ['#22c55e', '#14b8a6'], icon: 'i-heart' },
    news:    { nm: '소식',     c: ['#f472b6', '#f59e0b'], icon: 'i-mag' },
    default: { nm: '소식',     c: ['#64748b', '#94a3b8'], icon: 'i-mag' },
  };
  const TOPIC_LABEL_CAT = {
    '맨시티':'sport', '비트코인':'crypto', '마인크래프트':'game', '조류':'nature',

  function catOf(cat){ return CAT_META[cat] || CAT_META.default; }
  function catForTopic(topic){
    const lbl = topic.label || '';
    if (TOPIC_LABEL_CAT[lbl]) return TOPIC_LABEL_CAT[lbl];
    if (KIND[topic.kind]){
      if (topic.kind === 'coin') return 'crypto';
      if (topic.kind === 'stock') return 'stock';
      if (topic.kind === 'weather') return 'weather';
      if (topic.kind === 'fx') return 'fx';
      if (topic.kind === 'personal') return 'personal';
      if (topic.kind === 'sport') return 'sport';
    }
    // 카테고리 사전 매칭(과학/경제/게임 등)
    const newsCat = [['과학','science'],['기술','science'],['경제','global'],['정치','global'],['게임','game'],['축구','sport'],['음악','news']];

  /* ---------- 관심사 라벨 분류 (로컬 1차 추정 — 서버가 최종 판정/데이터) ---------- */
  const CITY_NAMES = ['서울','부산','인천','대구','대전','광주','울산','수원','제주','세종'];
  /* 회사 이름처럼 보이는지(주식 후보) — 서버가 실제 종목 해석, 여기선 1차 분류용 */
  const KR_COMPANY_TAIL = /(전자|화학|제약|바이오|생명|보험|증권|카드|지주|항공|철강|에너지|모터스|모비스|물산|건설|조선|중공업|소프트|테크|테크놀로지|케미칼|디스플레이|솔루션|엔터|푸드|리테일|마트|글로비스|모터|에어로스페이스|바이오로직스)$/;

  const EN_CONTENT_STOP = new Set(['minecraft','football','soccer','music','movie','film','camera','youtube','gaming','game','games','science','space','nasa','f1','bird','birds','birding','travel','food','fashion','art','books','kpop','drama','anime','crypto','weather','news','stock','technology','fitness','cooking','coding','language']);
  function isCompanyish(label){
    const l = String(label || '').trim();
    if (!l) return false;
    if (/[가-힣]/.test(l)){
      if (KR_COMPANY_TAIL.test(l)) return true;
      return WORLD_KO_STOCK.some(k => l.includes(k));
    }
    const toks = l.toLowerCase().replace(/[^a-z0-9&. ]+/g, ' ').trim().split(/\s+/).filter(Boolean);
    if (!toks.length) return false;
    if (toks.length === 1 && toks[0].length < 4) return false;
    return !toks.some(t => EN_CONTENT_STOP.has(t));
  }
  const SPORT_TEAM_KO = ['맨시티','맨체스터 시티','맨유','리버풀','아스널','아스날','첼시','토트넘','스퍼','뉴캐슬','아스톤빌라','레알','레알마드리드','바르샤','바르셀로나','뮌헨','바이에른','도르트문트','파리생제르맹','psg','인터밀란','인테르','유벤투스','나폴리','셀틱','다저스','양키스','레드삭스','보스턴','컵스','메츠','애스트로스','레이커스','셀틱스','워리어스','골든스테이트','너겟츠','닉스','불스','선스','벅스','kbo','nba','mlb','nhl','epl','프리미어리그','분데스리가','세리에a','라리가','리그앙','챔피언스리그','유로파'];
  const SPORT_WORD_RE = /(축구|야구|농구|배구|핸드볼|하키|테니스|골프|권투|ufc|구단|킥오프|원정|홈경기|경기 일정|리그)/i;
  function isSportsLabel(label){
    const low = String(label || '').toLowerCase().replace(/\s+/g, '');
    if (!low) return false;
    if (SPORT_TEAM_KO.some(k => low.includes(k.toLowerCase()))) return true;
    return SPORT_WORD_RE.test(low);
  }
  /* 밀리초 → 사람이 읽는 남은 시간 ('3일 4시간', '4시간 12분', '12분', '지금') */
  function durTxt(ms){
    if (ms == null || isNaN(ms)) return '--';
    const abs = Math.abs(ms);
    const d = Math.floor(abs / 86400000), h = Math.floor(abs % 86400000 / 3600000), m = Math.floor(abs % 3600000 / 60000);
    if (d >= 2) return `${d}일 ${h}시간`;
    if (d === 1) return `${d}일 ${h}시간`;
    if (h >= 1) return `${h}시간 ${m}분`;
    if (m >= 1) return `${m}분`;
    return '지금';
  }
  function classifyLabel(label){
    const l = String(label || '').trim().toLowerCase();
    if (/(습관|루틴|독서|명상|스트릭|달성|목표|프로젝트|걸음|수면|체중|기록|운동|헬스|러닝|달리기|만보|걷기|요가|스트레칭)/.test(l) || /주\s*\d+\s*회/.test(l)) return 'personal';
    if (/날씨|기상|온도|강수/.test(l)) return 'weather';
    if (isSportsLabel(label)) return 'sport';      // 팀·리그 확인 → 경기 일정/결과형 위젯
    if (/비트코인|이더리움|리플|도지|솔라나|에이다|수이|코인|가상자산|암호화폐|bitcoin|ethereum|btc|eth|xrp/.test(l)) return 'coin';
    if (/환율|환전|외환/.test(l)) return 'fx';
    if (/미국 달러|홍콩달러|캐나다달러|호주달러|달러|엔화|위안|유로|파운드|usd|jpy|cny|eur|gbp/.test(l)) return 'fx';
    if (/엔/.test(l) && !/엔터|엔씨|엔비|엔진/.test(l) && /(^|[^가-힣a-z])엔([^가-힣a-z]|$)/.test(l)) return 'fx';
    if (/주식|주가|증시|코스피|코스닥|전자|하이닉스|카카오|네이버|현대차|기아|셀트리온|금융지주|lg|sk|삼성|포스코|posco|hmm|^\d{6}$/.test(l)) return 'stock';
    if (isCompanyish(label)) return 'stock';      // 애플·테슬라·알파벳·삼성전자 등 회사명 → 주식
    return 'news';
  }
  function topicShort(label){
    const l = String(label || '');
    for (const c of CITY_NAMES) if (l.includes(c) && /날씨|기상/.test(l)) return c + ' 날씨';
    const cut = l.replace(/시세|가격|뉴스|소식|트렌드|관찰|최신|주가|정보/g, '').trim();
    return cut || l || '이 주제';
  }

  /* --- 큰 숫자(+등락+스파크) 공통 --- */
  function bigDelta(price, prev, chgPct, chgAbs, fmt, unitTxt){
    const dir = chgPct > 0.0001 ? 'up' : (chgPct < -0.0001 ? 'down' : 'flat');
    const arrow = chgPct > 0.0001 ? '▲' : (chgPct < -0.0001 ? '▼' : '');
    return `<div class="big" style="letter-spacing:-.02em">${fmt(price)}<small style="font-size:10px;margin-left:2px">${esc(unitTxt || '')}</small></div>
      <div class="delta ${dir}" style="margin-top:2px">${arrow} ${Math.abs(chgPct).toFixed(2)}% <span style="font-weight:500;color:var(--ink-3)">(${chgPct >= 0 ? '+' : ''}${fmt(Math.abs(chgAbs))})</span></div>`;
  }

    // a: 큰숫자+등락+스파크 기본

  /* --- 환율(FX): 큰 숫자(2자리)+전일 등락+일봉 스파크 --- */
  function fxInner(topic, payload){

  /* --- 스포츠: 종목별 맞춤 뷰 (F1/모터스포츠 vs 리그 종목) + 1위/우승/최다득점/MVP 명예의 전당 --- */

  /* F1 / 모터스포츠 전용 카드 */
  function motorsportInner(topic, d, nowMs){

        <span class="kicker muted" style="margin-left:auto">${d.clinched ? '<b style="color:var(--good)">우승 확정</b>' : '포뮬러 1'}</span></div>`;

    if (tpl === 'c'){ // 컴팩트
      const nextLine = next ? `<span class="big" style="font-size:19px">D-${Math.max(0, Math.ceil((next.ts - (nowMs || Date.now())) / 86400000))}</span><span class="muted" style="font-size:10px">${esc(next.name || '')} · ${esc(next.circuit || '')}</span>` : '';
      return `<div class="tile-mid" style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">${nextLine}</div>`
        + (lead ? `<div class="minirow"><span class="k">1위 선두</span><span class="v"><b>${esc(lead.name)}</b> (${lead.points}점 · ${esc(lead.team)})</span></div>` : '');
    }

    if (tpl === 'b'){ // 드라이버 순위표 + 컨스트럭터
      const rows = (d.standings || []).slice(0, 5).map(s => `
        <div class="minirow" style="align-items:baseline">
          <span class="k" style="flex:0 0 20px;font-weight:700;color:${s.rank===1?KIND.sport.c1:'inherit'}">${s.rank}</span>
          <span class="v" style="text-align:left;font-size:11px;flex:1"><b>${esc(s.name)}</b> <span class="muted">(${esc(s.team)})</span></span>
          <span class="v" style="font-weight:700;font-size:11px">${s.points}점</span>
        </div>`).join('');
      const c1 = (d.constructors || [])[0];
      return head + `<div class="sched-h" style="margin:2px 0 1px"><span class="kicker">드라이버 챔피언십 선두권</span></div>`
        + rows
        + (c1 ? `<div class="minirow" style="margin-top:2px"><span class="k">팀 1위</span><span class="v"><b>${esc(c1.team)}</b> (${c1.points}점)</span></div>` : '');
    }

    // a: 팬 한눈에 (드라이버 선두 + 다음 GP 세션 타임라인 + 직전 포디엄)
    const dd = next ? Math.max(0, Math.ceil((next.ts - (nowMs || Date.now())) / 86400000 + 0.0001)) : null;
    const left = next ? next.ts - (nowMs || Date.now()) : null;
    const sessList = (next && next.sessions ? next.sessions.slice(0, 3) : []).map(s => `<span class="sess-chip"><b>${esc(s.label)}</b> ${esc(s.when || '')}</span>`).join('');
    const podiumStr = lr && lr.podium && lr.podium.length ? lr.podium.slice(0, 3).map((p, i) => `${i === 0 ? '🥇' : (i === 1 ? '🥈' : '🥉')} ${esc(p.driver.split(' ').pop())}`).join(' · ') : '';

    return head
      + (d.honors ? honorBadgeHtml(d.honors) : '')
      + (next ? `<div style="display:flex;gap:8px;align-items:flex-end;margin-top:2px">
          <div style="min-width:0;flex:1">
            <span class="kicker" style="color:var(--ink-3)">다음 그랑프리</span>
            <div class="goal-line" style="font-size:13px;margin-top:1px">${esc(next.name)}</div>
          </div>
          <div style="margin-left:auto;text-align:right"><span class="big" style="font-size:24px;line-height:1">D-${dd}</span>
          <div class="muted" style="font-size:9.5px">${esc(durTxt(left))} 남음</div></div></div>
        <div class="minirow"><span class="k">서킷/본선</span><span class="v" style="font-size:10.5px">${esc(next.circuit || '')} · ${esc(next.when || '')}</span></div>
        ${sessList ? `<div class="sess-row">${sessList}</div>` : ''}` : '')
      + (lr ? `<div class="minirow" style="margin-top:2px"><span class="k">직전 포디엄</span><span class="v" style="font-size:10.5px">${podiumStr}</span></div>` : '')
      + (d.gap != null && lead ? `<div class="minirow"><span class="k">2위와 격차</span><span class="v" style="color:${KIND.sport.c1};font-weight:700">+${d.gap}점 ${d.roundsLeft ? `(잔여 ${d.roundsLeft}R)` : ''}</span></div>` : '');
  }

  function sportInner(topic, payload, nowMs){
    const d = payload.data || {};
    const tpl = topic.tpl || 'a';
    if (d.discipline === 'motorsport') return motorsportInner(topic, d, nowMs);

    const team = d.team || topicShort(topic.label);
    const next = d.next, live = d.live;
    const honors = d.honors || [];
    const mainHonor = honors[0] || null;
    const head = `<div style="display:flex;gap:6px;align-items:center">
        <span class="kicker" style="flex:0 0 auto;color:${KIND.sport.c1}">${esc(d.league || '스포츠')}${d.round ? ' · ' + esc(d.round) + 'R' : ''}</span>
        <span class="kicker muted" style="margin-left:auto">${live ? '<b style="color:var(--bad)">● LIVE</b>' : (d.sport ? esc(d.sport) : '실시간')}</span></div>`;

    if (tpl === 'c'){   // 컴팩트
      const line = live
        ? `<span class="big" style="font-size:22px">${esc(live.hs)} - ${esc(live.as)}</span><span class="muted" style="font-size:10px">${esc(live.status || '진행 중')} · ${esc(live.venue || '')}</span>`
        : (next ? `<span class="big" style="font-size:20px">D-${Math.max(0, Math.ceil((next.ts - (nowMs || Date.now())) / 86400000))}</span><span class="muted" style="font-size:10px">${esc(next.when || '')} · ${esc(next.venue || '')}</span>`
                : (mainHonor ? `<span class="big" style="font-size:17px">${esc(mainHonor.name)}</span><span class="muted" style="font-size:10px">${esc(mainHonor.value)}</span>` : `<span class="muted" style="font-size:11px">등록된 경기 없음</span>`));
      return `<div class="tile-mid" style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">${line}</div>`
        + (next && !live ? `<div class="muted" style="font-size:10px">${esc(next.home)} vs ${esc(next.away)}</div>` : '');
    }

    if (tpl === 'b'){   // 일정/순위 목록형
      const rows = (d.upcoming || []).slice(0, 3).map(e => {
        const t = teamSide(e);
        return `<div class="minirow" style="align-items:baseline"><span class="k" style="flex:0 0 66px">${esc((e.when || '').replace(/\s*\([^)]*\)\s*/, ' '))}</span>
          <span class="v" style="text-align:left;font-size:11px">${e.isHome === 1 ? 'vs' : '@'} <b>${esc(t.opp)}</b> <span class="muted" style="font-weight:400">· ${esc(e.venue || '')}</span></span></div>`;
      }).join('');
      const last = (d.results || [])[0];
      const std = d.standings;
      return head + `<div class="sched-h" style="margin:2px 0 1px"><span class="kicker">${esc(team)} · 일정 및 순위</span>${d.form && d.form.length ? `<span class="sform">${formDots(d.form)}</span>` : ''}</div>`
        + (rows || (std ? `<div class="minirow"><span class="k">현재 순위</span><span class="v"><b>${std.rank || '—'}위</b> (${std.points || '—'}점 · ${std.source || ''})</span></div>` : `<div class="muted" style="font-size:11px;padding:4px 0">예정 경기 없음</div>`))
        + (honors.length ? honorBadgeHtml(honors[0]) : '')
        + (last ? `<div class="minirow"><span class="k">최근 결과</span><span class="v">${esc(last.hs)} - ${esc(last.as)} ${esc(last.home)} vs ${esc(last.away)}</span></div>` : '');
    }

    // a: 팬 한눈에 (LIVE / 다음 경기 + 1위/최다득점/MVP 명예 배지 + 최근 결과 + 폼)
    const honorHtml = honors.slice(0, 2).map(honorBadgeHtml).join('');
    if (live){
      const t = teamSide(live);
      const mins = Math.max(0, Math.floor(((nowMs || Date.now()) - live.ts) / 60000));
      return head
        + `<div class="tile-mid" style="display:flex;align-items:center;gap:10px;margin-top:2px">
            <div class="big" style="font-size:32px">${esc(live.hs)} - ${esc(live.as)}</div>
            <div style="min-width:0;flex:1">
              <div style="font-size:12px;font-weight:700">${esc(live.home)} vs ${esc(live.away)}</div>
              <div class="muted" style="font-size:10px">${esc(live.status || '진행 중')} · ${mins}분 경과 · ${esc(live.venue || '')}</div></div></div>`
        + honorHtml
        + `<div class="minirow"><span class="k">경기장</span><span class="v">${esc(live.venue || d.homeGround || '—')}</span></div>`
        + (d.form && d.form.length ? `<div class="minirow"><span class="k">최근 5경기</span><span class="v"><span class="sform">${formDots(d.form)}</span></span></div>` : '');
    }

    if (!next){
      const std = d.standings;
      const rankLine = std && std.rank ? `<div class="minirow"><span class="k">리그 순위</span><span class="v"><b>${std.rank}위</b> · 승점 ${std.points}점 ${std.gapToLeader === 0 ? '(선두)' : `(1위와 -${std.gapToLeader})`}</span></div>` : '';
      return head
        + (honorHtml ? honorHtml : `<div class="goal-line" style="font-size:12.5px">${esc(team)} — 지금 예정된 경기가 없어요</div>`)
        + rankLine
        + ((d.results || []).slice(0, 2).map(e => `<div class="minirow"><span class="k">${esc((e.when || '').replace(/\s*\([^)]*\)\s*/, ' '))}</span><span class="v">${esc(e.home)} ${esc(e.score || '')} ${esc(e.away)}</span></div>`).join('') || '')
        + (d.form && d.form.length ? `<div class="minirow"><span class="k">최근 폼</span><span class="v"><span class="sform">${formDots(d.form)}</span></span></div>` : '')
        + `<div class="minirow" style="font-size:9.5px;color:var(--ink-3)"><span class="k">구장</span><span class="v">${esc(d.homeGround || '—')} · ${esc(d.source || '')}</span></div>`;
    }

    const t = teamSide(next);
    const dd = Math.max(0, Math.ceil((next.ts - (nowMs || Date.now())) / 86400000 + 0.0001));
    const left = next.ts - (nowMs || Date.now());
    const badge = next.isHome === 1 ? '홈' : '원정';
    return head
      + (honorHtml ? honorHtml : '')
      + `<div style="display:flex;gap:8px;align-items:flex-end;margin-top:2px">
          <span class="kicker" style="color:var(--ink-3);margin-bottom:4px">다음이 ${esc(badge)}경기</span>
          <div style="margin-left:auto;text-align:right"><span class="big" style="font-size:24px;line-height:1">D-${dd}</span>
          <div class="muted" style="font-size:9.5px">${esc(durTxt(left))} 남음</div></div></div>
        <div class="goal-line" style="font-size:13px;margin-top:1px">${esc(next.home)} <span style="opacity:.55">vs</span> ${esc(next.away)}</div>
        <div class="minirow"><span class="k">킥오프</span><span class="v">${esc(next.when || '—')}</span></div>
        <div class="minirow"><span class="k">경기장</span><span class="v" style="font-size:10.5px">${esc(next.venue || d.homeGround || '—')}</span></div>
        <div class="kick-bar"><i style="width:${Math.max(2, Math.min(100, 100 - Math.min(100, left / (7 * 86400000) * 100))).toFixed(1)}%"></i></div>`
      + ((d.results || []).length ? `<div class="minirow"><span class="k">최근 결과</span><span class="v" style="display:flex;align-items:center;gap:6px;justify-content:flex-end">${esc(d.results[0].home)} ${esc(d.results[0].score || '')} ${esc(d.results[0].away)}${d.form && d.form.length ? `<span class="sform">${formDots(d.form)}</span>` : ''}</span></div>` : '');
  }

  /* --- 개인 상태: 실소스 전 → 진행 게이지 틀 + 연결 안내 (가짜 숫자 없음) --- */
  function personalInner(topic){
    const label = topicShort(topic.label);
    const tpl = topic.tpl || 'a';
    const gauge = `<div class="ring" style="--p:0;"><b>--</b></div>
      <div style="min-width:0"><div class="goal-line">${esc(label)}</div>
        <div class="goal-sub">실데이터 소스(헬스·운동 앱 등)가 연결되면 채워져요.</div></div>`;
    const week = `<div class="wdays">${['월','화','수','목','금','토','일'].map(d => `<div class="wday"><span class="wdt">${d}</span><i></i><b style="font-size:9px;color:var(--ink-3)">--</b></div>`).join('')}</div>
      <div class="muted" style="font-size:10px;margin-top:2px">주간 기록 — 연결 후 표시</div>`;
    if (tpl === 'b') return `<div class="sched-h"><span class="kicker">${esc(label)} · 주간 현황</span></div>${week}
      <div class="minirow"><span class="k">상태</span><span class="v" style="color:var(--ink-3);font-size:10.5px">데이터 소스 대기</span></div>`;
    if (tpl === 'c') return `<div class="goal-line">${esc(label)} — 연결 전</div>
      <div class="goal-sub">개인 데이터는 사용자가 연결할 소스(애플 헬스·삼성 헬스 등)에서만 가져와요. 지금은 실제 값을 만들지 않습니다.</div>
      <div class="minirow"><span class="k">상태</span><span class="v" style="color:var(--ink-3);font-size:10.5px">연결 대기</span></div>`;
    return `<div style="display:flex;gap:11px;align-items:center;margin-top:2px">${gauge}</div>
      <div class="progress" style="margin-top:7px"><i style="width:0%"></i></div>
      <div class="minirow"><span class="k">상태</span><span class="v" style="color:var(--ink-3);font-size:10.5px">개인 데이터 소스 대기</span></div>`;
  }

  /* --- 뉴스/트렌드 타일: 실시간 피드 첫 기사 (사진·제목·요약) --- */
  function summaryOf(item){
    let raw = String(item.desc || '').replace(/<a\b[^>]*>[\s\S]*?<\/a>/gi, ' ').replace(/<[^>]*>/g, ' ')
      .replace(/https?:\/\/\S+/g, ' ').replace(/&(?:amp|nbsp|lt|gt|quot|#39);/gi, ' ').replace(/\s+/g, ' ').trim();
    if (raw.length < 20) return '';
    if (item.title && (raw.startsWith(item.title) || item.title.toLowerCase().startsWith(raw.toLowerCase()))) return '';
    let cut = raw.length;
    for (let i = 36; i < raw.length; i++){ const ch = raw[i]; if ('.!?。…'.includes(ch)){ cut = i + 1; break; } }
    raw = raw.slice(0, cut).trim();
    return raw.length >= 18 ? raw : '';
  }
  function newsTileInner(topic, payload){
    const items = payload.data.items || [];
    const item = items[0];
    const meta = catOf(catForTopic(topic));
    const label = topicShort(topic.label);
    const tpl = topic.tpl || 'a';
    if (tpl === 'b'){ // 헤드라인 목록 3건
      const list = items.slice(0, 3).map(it => `<a href="${esc(it.link)}" target="_blank" rel="noopener" style="display:flex;gap:6px;align-items:flex-start;padding:3px 0;text-decoration:none;color:inherit">
        <i style="width:5px;height:5px;border-radius:99px;background:linear-gradient(135deg,${meta.c[0]},${meta.c[1]});flex:0 0 auto;margin-top:6px"></i>
        <span style="font-size:11px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(it.title)}</span></a>`).join('');
      return `<div class="sched-h" style="margin-bottom:2px"><span class="kicker" style="color:${meta.c[0]}">${esc(label)} · 실시간</span></div>${list}
        <div class="minirow"><span class="k">소스</span><span class="v" style="font-size:10px">${esc(items.map(i => i.src).filter((v,i,a)=>a.indexOf(v)===i).slice(0,2).join(' · ') || '—')} · ${items[0] ? esc($U.ago(items[0].pub)) + ' 전' : ''}</span></div>`;
    }
    const hasImg = item && item.img;
    const imgHTML = hasImg ? `<div class="tile-news-thumb"><img src="${esc(item.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.tile-news-thumb')?.remove?.()"/></div>` : '';
    if (tpl === 'c'){ // 제목+한줄
      return `<div class="goal-line" style="font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(item ? item.title : '새 소식을 불러오는 중…')}</div>
        ${item && summaryOf(item) ? `<div class="goal-sub" style="margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(summaryOf(item))}</div>` : ''}
        <div class="minirow"><span class="k">${esc(item ? item.src : '상태')}</span><span class="v" style="font-size:10px;color:var(--ink-3)">${item ? esc($U.ago(item.pub)) + ' 전 · 실시간' : '불러오는 중'}</span></div>`;
    }
    // a: 대표 카드(썸네일+제목+요약2줄)
    return `<div style="display:flex;gap:8px;align-items:flex-start">
        <span class="wd-dot" style="width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,${meta.c[0]},${meta.c[1]});flex:0 0 auto;margin-top:1px">${ic(meta.icon, 10)}</span>
        <div style="min-width:0;display:flex;gap:7px;width:100%">
          <div style="min-width:0;flex:1">
            <div class="goal-line" style="font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(item ? item.title : '새 소식 로딩…')}</div>
            ${item && summaryOf(item) ? `<div class="goal-sub" style="margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(summaryOf(item))}</div>` : ''}
          </div>
          ${imgHTML}
        </div>
      </div>
      <div class="minirow"><span class="k">${esc(item ? item.src : '상태')}</span><span class="v" style="font-size:10px;color:var(--ink-3)">${item ? esc($U.ago(item.pub)) + ' 전 · 실시간' : ''}${item && item.img ? '' : ''}</span></div>`;
  }

  /* payload.data 를 카드 본문으로 */
  function tileBodyFor(topic, payloadRaw){
    const kindMeta = KIND[topic.kind] || KIND.news;
    if (!payloadRaw) return tileSkeleton(topic.kind);
    if (payloadRaw.status === 'loading') return tileSkeleton(topic.kind);
    if (payloadRaw.status === 'off') return tileOffline(kindMeta, topic);
    if (payloadRaw.status === 'error') return tileError(kindMeta);
    const payload = payloadRaw;          // 데이터 가공 패치는 저장 시점(app)에서 1회 적용 — 이중 변환 방지
    const kind = payload.kind || topic.kind;
    if (kind === 'coin' || kind === 'stock') return quoteInner(topic, payload);
    if (kind === 'fx') return fxInner(topic, payload);
    if (kind === 'weather') return weatherInner(topic, payload);
    if (kind === 'sport') return sportInner(topic, payload, Date.now());
    if (kind === 'personal') return personalInner(topic);
    if (kind === 'news' && isSportsLabel(topic.label) && !(payload.data && payload.data.items && payload.data.items.length)) return sportDraftInner(topic);   // 팀 확인 전·소스 제한 → 시안 골격(숫자 없음)
    return newsTileInner(topic, payload);
  }
  /* 패치 훅까지 거친 최종 본문 */
  function tileBody(topic, payload){
    const body = tileBodyFor(topic, payload);
    if (global.BPatch && global.BPatch.applyHtml && payload && payload.status === 'ok') return global.BPatch.applyHtml(topic, payload, body, 'tile');
    return body;
  }

  /* 타일 전체 HTML (payload: {status, kind, data} | null) */
  function buildTileHTML(topic, payload){
    const kindMeta = KIND[topic.kind] || KIND.news;
    const c1 = kindMeta.c1, c2 = kindMeta.c2, icon = kindMeta.icon;
    const tileTitle = topic.label || kindMeta.label;
    const body = tileBody(topic, payload);
    return `<div class="tile ${topic.kind === 'news' ? 'tile-news' : ''}" data-bp-kind="${esc(topic.kind)}" style="--t1:${c1};--t2:${c2};" data-tid="${esc(topic.id)}">
      <span class="grad-tint"></span>
      <div class="tile-head">
        <span class="tile-drag-handle" title="드래그하여 순서 변경">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.8"/><circle cx="16" cy="6" r="1.8"/><circle cx="8" cy="12" r="1.8"/><circle cx="16" cy="12" r="1.8"/><circle cx="8" cy="18" r="1.8"/><circle cx="16" cy="18" r="1.8"/></svg>
        </span>
        <span class="tile-name"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#${icon}"/></svg>${esc(tileTitle)}</span>
        <span class="tile-kind">${kindMeta.label}</span>
        <span style="display:flex;gap:2px;margin-left:auto">
          <button class="icon-btn tile-refresh" data-tid="${esc(topic.id)}" title="최신 데이터로 새로고침" style="width:22px;height:22px;border:none;background:none;opacity:.6">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#i-reload"/></svg>
          </button>
          <button class="icon-btn tile-edit" data-tid="${esc(topic.id)}" title="이 카드 설정" style="width:22px;height:22px;border:none;background:none;opacity:.75">

<script>
/* ============================================================
   LOGIC — AI 브레인 (프로토타입 = 휴리스틱 엔진)
   실제 배포 시 자연어 피드백 → GPT 파이프라인으로 교체.
   여기서는 "되돌리기 가능한 규칙" + "후보 제안"으로 동작.
   ============================================================ */
(function (global) {
  'use strict';

  const L = {};

  /* ---------- 레이아웃 : 위젯 3개 그리드 (AI가 균형만 관리) ---------- */
  const LAYOUTS = {
    'today-hero': { label:'오늘 중심', desc:'좌측 큰 ‘오늘 일정’ + 우측 관심사·브리핑', a:'today' },
    'topics-hero':{ label:'관심사 중심', desc:'좌측 큰 ‘관심사 카드’ + 우측 오늘·브리핑', a:'topics' },
    'news-hero':  { label:'브리핑 중심', desc:'좌측 큰 ‘Today’s Briefing’ + 우측 오늘·관심사', a:'news' },
    'equal':      { label:'균등 3분할', desc:'세 위젯을 같은 크기로 나란히', a:'today' },
  };
  function decideLayout(topicCount, curLayout){
    if (topicCount >= 5 && curLayout !== 'topics-hero') return 'topics-hero';
    if (topicCount === 0 && curLayout !== 'news-hero') return 'news-hero';

  }


  /* ---------- 실시간 날씨 → 배경 하늘(경보) 자동 판정 ----------
     사용자가 "비가 안 와서 미리보기 버튼만 눌러봤다"고 확인하지 못하던 문제:
     판정 함수를 UI와 분리해 실측(날씨코드·강수량·미세먼지·기온)만으로 결정하게 하고,
     아래 decideSky() 가 수동 미리보기보다 실측을 우선하도록 합친다. */
  const WX = {
    storm: /뇌우|천둥|번개|thunder/i,
    rain:  /비|소나기|이슬비|drizzle|rain/i,
    snow:  /눈|소낙눈|snow|sleet/i,
    dust:  /황사|미세먼지|sand|dust/i,
  };
  /* w: 서버 weather payload {code,cond,precip,rainPct,pm10,temp,feels} */
  function skyAlertFromWeather(w){
    if (!w) return null;
    const code = Number(w.code != null ? w.code : w.icon);
    const cond = String(w.cond || '');
    const mm = Number(w.precip || 0);
    const pct = Number(w.rainPct != null ? w.rainPct : 0);
    const pm = Number(w.pm10 != null ? w.pm10 : 0);
    const t = Number(w.temp != null ? w.temp : NaN);
    if (WX.storm.test(cond) || (code >= 95 && code <= 99)) return 'storm';
    if (WX.snow.test(cond) || (code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
    if (WX.rain.test(cond) || mm >= 0.1 || (pct >= 60 && (code >= 51 && code <= 67 || code >= 80 && code <= 82))) return 'rain';
    if (pm >= 150) return 'dust';                       // 매우 나쁨 이상 → 황사·미세먼지 하늘
    if (!isNaN(t) && t >= 35) return 'heat';            // 폭염 수준
    if (!isNaN(t) && t <= -12) return 'cold';           // 한파 수준
    return null;
  }
  /* 수동 미리보기(state.skyMode)와 실측을 합친다.
     - auto: 실측 경보가 있으면 그 하늘, 없으면 시간대 하늘
     - 수동 선택: 선택을 존중(프리뷰 용도)하되, 실측 경보가 'clear'로 돌아오면 자동으로 되돌아간다 */
  function decideSky(mode, alert, hour){
    const m = mode || 'auto';
    const isAlert = !!ALERT_KEYS[m];
    if (m !== 'auto' && m !== 'clear' && !isAlert) return { base: m, weath: null, manual: 1, auto: 0 };  // 낮·노을·밤 고정
    if (isAlert) return { base: m, weath: m, manual: 1, auto: 0 };                                       // 수동 미리보기(경보)
    if (alert) return { base: alert, weath: alert, manual: 0, auto: 1 };                                 // ← 실측으로 자동 전환
    return { base: skyKeyByHour(hour), weath: null, manual: 0, auto: 0 };
  }
  const ALERT_KEYS = { rain:1, storm:1, dust:1, heat:1, cold:1, snow:1 };
  function skyKeyByHour(h){
    if (h >= 5 && h < 8)  return 'dawn';
    if (h >= 8 && h < 17) return 'day';
    if (h >= 17 && h < 19) return 'sunset';
    if (h >= 19 && h < 22) return 'dusk';
    return 'night';
  }
  const SKY_ALERT_LABEL = { rain:'비', storm:'뇌우·폭풍', snow:'눈', dust:'미세먼지·황사', heat:'폭염', cold:'한파' };

  /* ---------- 뉴스레터 읽음 큐 — good! = 그 기사를 읽었으므로 같은 관심사의 다음 기사로 ---------- */
  function readKey(tid, id){ return String(tid) + '|' + String(id); }
  function pickUnread(items, muted, read, tid){
    const list = items || [];
    const m = muted || [], r = read || [];
    const alive = list.filter(it => !m.includes(it.id));
    if (!alive.length) return { item: null, exhausted: list.length === 0, allRead: false };
    const unread = alive.filter(it => !r.includes(readKey(tid, it.id)));
    if (unread.length) return { item: unread[0], read: alive.length - unread.length, total: alive.length };
    return { item: null, allRead: true, read: alive.length, total: alive.length };
  }
  /* 읽음 표시 후 무엇을 할지: 다음 기사로 갈지(next), 새로 수집할지(fetch), 순환할지(cycle) */
  function advanceAfterRead(items, muted, read, tid){
    const p = pickUnread(items, muted, read, tid);
    if (p.item) return { action: 'next', item: p.item, read: p.read, total: p.total };
    if (p.allRead) return { action: 'fetch', read: p.read, total: p.total };
    return { action: 'empty' };
  }

  /* ---------- 관심사 빠른 추가용 추천 (추가 버튼/빈 화면/관리창) ----------
     실제로 라이브 소스(RSS)가 수집되는 관심사만 추천한다. 시세·날씨처럼
     “가짜 숫자”로 채워지는 데이터형은 실시간 소스 연결 전까지 추천하지 않는다. */
  const TOPIC_SUGGESTIONS = [
    { label:'맨시티 축구',      kind:'news', cfg:{ preset:'trend' } },
    { label:'비트코인 뉴스',    kind:'news', cfg:{ preset:'trend' } },
    { label:'마인크래프트',     kind:'news', cfg:{ preset:'trend' } },
    { label:'조류 관찰(버드워칭)', kind:'news', cfg:{ preset:'trend' } },
  ];

  /* ---------- 피드백 자연어 처리 (키워드 규칙) ---------- */
  function planFromFeedback(text, topics){
    topics = topics || [];
    const t = text.toLowerCase().replace(/\s+/g,' ');
    const plan = { rules:[], toast:null, ask:null, note:'', layout:null };
    const has = (...ks) => ks.some(k => t.includes(k));

    if (has('어둡게','다크','야간','어두운') && !has('밝게','밝은','환하게')){
      plan.rules.push({ t:'theme', v:'dark', log:'어두운 테마로 전환 (자동 테마 일시 해제)' });
    } else if (has('밝게','라이트','환하게','밝은','낮모드')){
      plan.rules.push({ t:'theme', v:'light', log:'밝은 테마로 전환' });
    }

    if (has('주식','종목','코스피','차트') && has('초록','그린','미국식','해외식','유럽식')){
      plan.rules.push({ t:'stockColor', v:'us', log:'상승=초록·하락=빨강(미국식) 표시로 변경' });
    } else if (has('주식','종목','코스피') && has('빨간','빨강')){
      plan.rules.push({ t:'stockColor', v:'kr', log:'상승=빨강·하락=파랑(한국식) 표시 유지' });
    }

    if (has('글자','글씨') && has('크게','커지','확대')){
      plan.rules.push({ t:'scale', v:0.06, log:'글자를 6% 키워 표시' });
    } else if (has('글자','글씨') && has('작게','작아','축소')){
      plan.rules.push({ t:'scale', v:-0.06, log:'글자를 6% 줄여 표시' });
    }

    if (has('심플','간결','깔끔','단순','복잡','지저분','정돈','정리','많아','넘쳐','압축','간단')){
      plan.rules.push({ t:'clean', log:'표시를 압축: 보조 문구·꾸밈 요소를 접고 핵심만 강조' });
    }

    /* 주제 우선순위: "XX를 맨 위에/먼저/제일 위" */
    if (topics.length){
      const target = topics.find(tp => {
        const short = tp.label.toLowerCase();
        return t.includes(short) || short.split(/[\s·]/).some(w => w.length>=2 && t.includes(w));
      });
      if (target && (has('맨 위','위로','먼저','첫 번째','제일 앞','앞에','순서'))){
        plan.rules.push({ t:'topicTop', tid:target.id, label:target.label,
          log:`관심사 <b>${target.label}</b>을 맨 앞 순서로 배치 → 브리핑/카드도 01번부터 갱신` });
      }
    }

    if (has('일정') && has('왼쪽','크게','위로','맨 위')){
      plan.layout = 'today-hero'; plan.rules.push({ t:'layout', log:'‘오늘 일정’을 좌측 대형 자리로 배치' });
    }
    if (has('관심사','카드','타일') && has('왼쪽','크게','위로')){
      plan.layout = 'topics-hero'; plan.rules.push({ t:'layout', log:'‘관심사 카드’를 좌측 대형 자리로 배치' });
    }
    if (has('브리핑','뉴스','기사') && has('왼쪽','크게','위로','메인')){
      plan.layout = 'news-hero'; plan.rules.push({ t:'layout', log:'‘Today’s Briefing’을 좌측 대형 자리로 배치' });
    }
    if (has('주식','종목') && has('빼','삭제','없애','지워','싫어')){
      plan.ask = '브리핑 위젯에서 "관심없음"을 누르면 그 주제 소식을 편집자가 다른 걸로 교체해요. 여기서는 다른 변경을 원하셨을까요?';
    }
    if (has('칸') && has('어디','아니','또')){
      plan.ask = plan.ask || '이 피드백 반영 칸은 보드의 어느 요소든 고치기 위한 통로예요. 바꾸고 싶은 걸 자유롭게 적어주세요.';
    }
    if (!plan.rules.length && !plan.layout && (t.trim().length <= 6)){
      plan.ask = '어떤 부분을 어떻게 바꿀지 조금 더 알려주세요. 예: “글자 크게”, “다크 모드로”, “비트코인을 맨 위에”';
    }

  }

<script>

   APP — AI 브리핑 보드 메인 (Windows 데스크톱 위젯 1차 프로토타입)

(function () {

  if (!Array.isArray(state.mutedIds)) state.mutedIds = [];
  // 관심사 스키마 정규화: 종류/템플릿/브리핑 포함(기본 ON) 정리 — 라이브 파이프라인 스키마(v4)

  }

  /* ============ helpers ============ */
  const $  = s => document.querySelector(s);

  const ic = (n, w=14) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#${n}"/></svg>`;

    $('#tbTheme').title = state.autoTheme ? '테마 자동(시간대) — 수동 전환' : '수동 테마 — 자동으로 복귀';

  const skyKeyByHour = Lg.skyKeyByHour || (h => (h >= 5 && h < 8 ? 'dawn' : h >= 8 && h < 17 ? 'day' : h >= 17 && h < 19 ? 'sunset' : h >= 19 && h < 22 ? 'dusk' : 'night'));

  const SKY_MODE = {

  /* 하늘 판정의 실측 소스: 등록한 날씨 관심사 payload(우선) → 서울 실측 */
  function liveWxForSky(){
    for (const t of state.topics){
      if (t.kind !== 'weather') continue;
      const p2 = livePayload[t.id];

  }
  function skyAlertNow(){ return Lg.skyAlertFromWeather(liveWxForSky()); }
  function skyDecision(){
    const d = Lg.decideSky(state.skyMode || 'auto', skyAlertNow(), now().getHours());

  }
  function ensureDrops(){
    const box = $('#glassDrops');
    if (box.childElementCount) return;
    for (let i = 0; i < 30; i++){
      const b = document.createElement('i');
      const j = document.createElement('span'); j.className = 'blob';
      const rnd = (a,b)=>a+Math.random()*(b-a);
      b.style.cssText = `left:${rnd(0,97)}%; top:${rnd(0,45)}%; animation-delay:${rnd(0,1.8)}s; animation-duration:${rnd(1.3,2.4)}s;`;
      j.style.cssText = `left:${rnd(1,98)}%; top:${rnd(0,92)}%; width:${rnd(9,30)}px; height:${rnd(7,20)}px;`;

  /* --- 경보 전용 FX 노드 생성 (클리어 시 비움) --- */
  function clearNode(n){ while (n && n.firstChild) n.removeChild(n.firstChild); }
  function buildDustClouds(){
    const beh = $('#fxBehind');
    for (let i = 0; i < 3; i++){
      const c = document.createElement('div'); c.className = 'dcloud';
      const rnd = (a,b)=>a+Math.random()*(b-a);
      c.style.cssText = `left:${rnd(0,55)}%; top:${rnd(8,64)}%; width:${rnd(380,720)}px; height:${rnd(240,440)}px; ` +
        `animation-duration:${rnd(46,84).toFixed(1)}s; animation-delay:${-rnd(0,40).toFixed(1)}s;`;
      beh.appendChild(c);
    }

  function buildHeatBands(){
    const fr = $('#fxFront');
    for (let i = 0; i < 7; i++){
      const b = document.createElement('div'); b.className = 'hband';
      const rnd = (a,b)=>a+Math.random()*(b-a);
      b.style.cssText = `--hd:${rnd(6,12).toFixed(2)}s; --hh:${rnd(70,170).toFixed(0)}px; ` +
        `bottom:${rnd(-30,35).toFixed(0)}%; animation-delay:${-rnd(0,12).toFixed(2)}s;`;

  function buildIcicles(){
    const bf = $('#boardFx'); clearNode(bf);
    const rnd = (a,b)=>a+Math.random()*(b-a);
    const spots = [6,14,24,34,44,55,65,75,85,93];
    for (let i = 0; i < 9; i++){
      const left = spots[Math.floor(rnd(0, spots.length))] + rnd(-2.5,2.5);
      const ic = document.createElement('div'); ic.className = 'icicle';
      ic.style.left = left.toFixed(1) + '%';
      ic.style.animationDelay = (-rnd(0,6)).toFixed(2) + 's';

  function renderFX(weath){
    const beh = $('#fxBehind'), fr = $('#fxFront'), bf = $('#boardFx');
    clearNode(beh); clearNode(fr); clearNode(bf);
    if (weath === 'dust') buildDustClouds();
    else if (weath === 'heat') buildHeatBands();
    else if (weath === 'cold') buildIcicles();
    // rain/storm/snow: 배경·위젯·창유리 효과는 CSS 전용
  }
  function applyAmbience(force){
    const dec = skyDecision();
    const base = dec.base;
    const weath = dec.weath || 'clear';
    if (!dec.manual){                        // 실측으로 전환된 순간만 알린다(매 틱 반복 알림 금지)
      const seen = applyAmbience._alertSeen || null;
      if (weath !== 'clear' && weath !== seen) pushLog(`실시간 기상 감지 → 배경 하늘을 <b>${(Lg.SKY_ALERT_LABEL || {})[weath] || weath}</b>(으)로 전환`);
      else if (seen && weath === 'clear') pushLog('기상 특보 해제 → 시간대 하늘로 자동 복귀');
      applyAmbience._alertSeen = weath === 'clear' ? null : weath;
    }
    const sig = [base, weath, themeOf()].join('|');
    if (!force && applyAmbience._sig === sig) return;
    applyAmbience._sig = sig;
    const pal = SKY_PAL[base] ? SKY_PAL[base][themeOf() === 'dark' ? 'd' : 'l'] : null;
    const grad = $('#sky .grad'), orb = $('#sky .orb');
    if (pal){
      document.body.dataset.sky = base;
      grad.style.background = `linear-gradient(180deg, ${pal.c.join(',')})`;
      orb.style.cssText = `left:${pal.orb.x}%; top:${pal.orb.y}%; width:${pal.orb.w}px; height:${pal.orb.h}px; ` +
        `background:radial-gradient(circle at 50% 60%, ${pal.orb.c} 0%, rgba(255,255,255,0) 64%);`;
    }
    Object.keys(ALERT_KEYS).forEach(c => document.body.classList.toggle(c, weath === c));
    document.body.classList.toggle('drops', weath === 'rain' || weath === 'storm');
    if (weath === 'rain' || weath === 'storm') ensureDrops();
    renderFX(weath);
  }

  /* 오늘 위젯 상단의 서울 날씨 — 실제 Open-Meteo(서버) 값만. 없으면 숫자 대신 연결 안내 */
  let seoulWx = null, seoulWxAt = 0;
  function wxIconTag(){
    if (!seoulWx) return 'i-sun';
    const n = String(seoulWx.icon || '');
    if (/^(3|4|9|10|11|9[0-9]|95|96|99)$/.test(n)) return 'i-drop';           // 비·소나기·뇌우
    if (/^(7|8|71|73|75|77|85|86)$/.test(n)) return 'i-drop';                  // 눈
    if (/clear|sun/i.test(n)) return 'i-sun';
    if (/cloud|overcast/i.test(n)) return 'i-sun';
    return 'i-wind';
  }
  function paintSeoulWeather(){
    const tEl = $('#wxTemp'), iEl = $('#wxIco'), cEl = $('#wxChip');
    if (!tEl || !iEl || !cEl) return;
    if (seoulWx && seoulWx.temp != null){
      tEl.textContent = Math.round(seoulWx.temp) + '°';
      iEl.innerHTML = ic(wxIconTag(), 24);
      cEl.textContent = `서울 · ${seoulWx.cond || ''}${seoulWx.humidity != null ? ' · 습도 ' + Math.round(seoulWx.humidity) + '%' : ''}`;
    } else if (LIVE){
      tEl.textContent = '--°';
      iEl.innerHTML = ic('i-sun', 24);
      cEl.textContent = '서울 · 날씨 불러오는 중';
    } else {
      tEl.textContent = '--°';
      iEl.innerHTML = ic('i-sun', 24);
      cEl.textContent = '서울 · 실시간 연결 필요';
    }
    if (window.BPatch && window.BPatch.count && window.BPatch.count()) renderWxStrip();
  }
  async function ensureSeoulWeather(){
    if (seoulWx && Date.now() - seoulWxAt < 5 * 60 * 1000) return;
    try {
      const b = await liveBase();
      if (!b){ paintSeoulWeather(); return; }
      const r = await apiGet('/api/live/interest?topic=seoul&label=' + encodeURIComponent('서울') + '&kind=weather');
      if (r && r.ok !== false && r.weather){ seoulWx = r.weather; seoulWxAt = Date.now(); renderWxStrip(); applyAmbience(true); }
    } catch (e) {}
    paintSeoulWeather();
  }
  /* 오늘 일정 위젯의 날씨 줄 — 피드백으로 만들어진 ‘스트립’ 패치(#wxStrip)가 여기에 붙는다 */
  function renderWxStrip(){
    const box = $('#wxStrip');
    if (!box) return;
    if (!window.BPatch || !window.BPatch.applyHtml || !seoulWx){ box.innerHTML = ''; return; }
    const topic = { id: '_strip', label: '서울 날씨', kind: 'weather' };
    const payload = { status: 'ok', kind: 'weather', data: seoulWx };
    let html = '';
    try { html = window.BPatch.applyHtml(topic, payload, '', 'strip'); } catch (e) { html = ''; }
    box.innerHTML = html || '';
    box.style.display = html ? 'block' : 'none';
  }
  function scheduleSource(){
    // 소스 우선순위: 라이브(host/iCloud) > 사용자가 직접 추가한 일정 — 가짜 시드 일정 없음
    if (Array.isArray(window.__liveEvents)) return { live: true, events: window.__liveEvents };
    if (state.demoEvents && state.demoEvents.length) return { live: false, user: true, events: state.demoEvents };
    return { live: false, events: [] };
  }
  function normalizeEvents(list){
    return (list || []).map(e => {
      const st = e.st instanceof Date ? e.st : new Date(e.st);
      const en = (e.en ? (e.en instanceof Date ? e.en : new Date(e.en)) : st);
      return { ...e, st, en, state: en <= now() ? 'done' : (st <= now() ? 'now' : 'up') };
    }).filter(e => !isNaN(e.st)).sort((a,b) => a.st - b.st);
  }

  function renderSchedule(){

    const up = events.find(e => e.state==='up');

  /* ============================================================
     라이브 파이프라인 — 실데이터(미니 서버/네이티브 API)와 대화
     payload: { tid: { status:'ok', kind, data, at, err? } }
     feed  :  { tid: { items:[], at } }   (뉴스레터·뉴스 타일용 기사 목록)
     ============================================================ */
  let LIVE = null;                 // { base } — 연결되면 채워짐
  let liveLoadingStarted = false;  // 최초 로드 kick 1회만
  const livePayload = {};          // 타일 데이터
  /* 저장 시점에 코드 패치(BPatch)의 데이터 변환을 1회 적용한다 — 렌더가 반복 적용되지 않도록 여기서만. */
  function setLivePayload(tid, p){
    const t = state.topics.find(x => x.id === tid);
    livePayload[tid] = (t && p && p.status === 'ok' && window.BPatch && window.BPatch.applyData) ? window.BPatch.applyData(t, p) : p;
  }
  const liveFeed = {};             // 관심사별 실시간 기사
  const liveLock = {};             // 동시 fetch 방지
  async function liveBase(){
    if (LIVE) return LIVE;
    // 1) 네이티브/호스트 모드
    const h = window.__BRIEFING_HOST__;
    if (h && h.apiBase) { LIVE = { base: String(h.apiBase).replace(/\/+$/, '') }; return LIVE; }
    // 2) http(s) 서빙(미니 라이브 서버/개발) — /api/health 확인
    if (location.protocol === 'http:' || location.protocol === 'https:'){
      const base = location.origin;
      try {
        const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 2500);
        const r = await fetch(base + '/api/health', { signal: ctl.signal, cache: 'no-store' });
        clearTimeout(t);
        if (r.ok){
          LIVE = { base };
          // 미니 라이브 서버(native 에뮬) → 설정에 iCloud 연결 입력칸이 뜨도록 호스트 모드로 승격
          if (!h) window.__BRIEFING_HOST__ = { apiBase: base, web: true };
          return LIVE;
        }
      } catch (e) {}
    }
    return null;
  }
  async function apiGet(path){
    const b = await liveBase();
    if (!b) throw new Error('no-live');
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 25000);
    try {
      const r = await fetch(b.base + path, { signal: ctl.signal, cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }
  async function apiPost(path, body){
    const b = await liveBase();
    if (!b) throw new Error('no-live');
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 40000);
    try {
      const r = await fetch(b.base + path, { method: 'POST', signal: ctl.signal, cache: 'no-store',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
      const j = await r.json().catch(() => ({ ok: false, error: 'HTTP ' + r.status }));
      return j;
    } finally { clearTimeout(t); }
  }
  const TOPIC_LOCK = {};
  function topicKey(t){ return (t && (t.key || (t.cfg && t.cfg.key))) || (t && t.id) || (t && t.label) || ''; }
  function labelOf(t){ return String(t.label || '').trim() || String(t.key || ''); }
  function quoteKind(rk, ck){
    if (rk && ['coin','stock','fx'].includes(rk)) return rk;
    if (ck === 'fx') return 'fx';
    return ck === 'stock' ? 'stock' : 'coin';
  }

  async function loadTopicPayload(t, opts){
    opts = opts || {};
    const tid = t.id;
    const isSingle = !!opts.single;
    const isFresh = !!opts.fresh;
    const key = encodeURIComponent(topicKey(t));
    const lbl = encodeURIComponent(labelOf(t));
    const kind = t.kind;
    const lockId = tid + (isFresh ? ':f' : '');
    if (liveLock[lockId]) return liveLock[lockId];
    liveLock[lockId] = (async () => {
      try {
        if (!opts.background){
          setLivePayload(tid, { status: 'loading', kind, data: null });
          rerenderTile(tid);
        }
        const b = await liveBase();
        if (!b){ setLivePayload(tid, { status: 'off', kind, data: null }); rerenderTile(tid); return; }
        if (kind === 'personal'){
          setLivePayload(tid, { status: 'ok', kind: 'personal', data: {} });
          rerenderTile(tid); return;
        }
        const freshQ = isFresh ? '&fresh=1&force=1&_t=' + Date.now() : '';
        const interestNeeded = kind !== 'news';
        const resp = interestNeeded
          ? await apiGet('/api/live/interest?topic=' + key + '&label=' + lbl + '&kind=' + kind + freshQ)
          : await apiGet('/api/live/news?topic=' + key + '&label=' + lbl + (isFresh ? '&fresh=1&force=1&_t=' + Date.now() : '&seen=0'));
        if (!resp || resp.ok === false) throw new Error((resp && resp.error) || 'empty');
        if (Array.isArray(resp.items)){                        // 뉴스(항목) 응답
          const items = (resp.items || []).map(it => ({ ...it, rss: true, ago: D.$U.ago(it.pub), link: it.link || it.url }));
          setLivePayload(tid, { status: 'ok', kind: 'news', data: { items }, cadence: resp.cadence, noNew: resp.noNew, at: Date.now() });
          if (items.length) liveFeed[tid] = { items, at: Date.now() };
        } else if (resp.quote){                                // 시세(코인/주식/환율)
          setLivePayload(tid, { status: 'ok', kind: quoteKind(resp.kind, kind), data: resp.quote, cadence: resp.cadence, at: Date.now() });
          if (t.brief){
            try {
              const n = await apiGet('/api/live/news?topic=' + key + '&label=' + lbl + freshQ);
              if (n && n.items) liveFeed[tid] = { items: n.items.map(it => ({ ...it, rss: true, ago: D.$U.ago(it.pub), link: it.link || it.url })), at: Date.now() };
            } catch (e) {}
          }
        } else if (resp.sport){                                // 스포츠 — F1/축구/야구/순위/최다득점
          setLivePayload(tid, { status: 'ok', kind: 'sport', data: resp.sport, note: resp.note || '', cadence: resp.cadence, at: Date.now() });
        } else if (resp.weather){                              // 날씨
          livePayload[tid] = { status: 'ok', kind: 'weather', data: resp.weather, cadence: resp.cadence, at: Date.now() };
          if (resp.weather && (resp.weather.code != null || resp.weather.precip != null)){ seoulWx = resp.weather; seoulWxAt = Date.now(); renderWxStrip(); applyAmbience(true); }
        } else {
          livePayload[tid] = { status: 'error', kind, data: null };
        }
      } catch (e) {
        livePayload[tid] = { status: (await liveBase()) ? 'error' : 'off', kind, data: null, err: ((e && e.name) ? e.name + ': ' : '') + String((e && e.message) || e) + ' @' + String((e && e.stack || '').split('\n')[1] || '').trim().slice(0,80) };
      } finally {
        delete liveLock[lockId];
        rerenderTile(tid);
        // 단일 관심사 새로고침(isSingle)일 때는 브리핑 레일을 건드리지 않는다 — 전체 새로고침 때만 브리핑 동기화
        if (!isSingle) rerenderBriefSafe();
      }
    })();
    return liveLock[lockId];
  }
  async function ensureAllTopics(fresh){
    await Promise.allSettled(state.topics.map(t => loadTopicPayload(t, { fresh }).catch(() => {})));
  }
  function payloadOf(t){ return livePayload[t.id] || (LIVE ? { status: 'loading', kind: t.kind, data: null } : { status: 'off', kind: t.kind, data: null }); }
  function feedOf(t){
    if (liveFeed[t.id] && liveFeed[t.id].items) return liveFeed[t.id].items;
    const p = livePayload[t.id];
    if (p && p.status === 'ok' && p.kind === 'news') return (p.data && p.data.items) || [];
    return [];
  }

  /* 관심없음 → 이 관심사의 “지금 새 기사”를 실시간 수집해 맨 앞에 놓는다 */
  async function fetchFreshForTopic(t){
    const key = encodeURIComponent(topicKey(t));
    const lbl = encodeURIComponent(labelOf(t));
    const exclude = (state.mutedIds || []).concat((liveFeed[t.id] && liveFeed[t.id].items || []).map(i => i.id)).filter(Boolean).join(',');
    let items = [];
    try {
      const resp = await apiGet('/api/live/news?topic=' + key + '&label=' + lbl + '&exclude=' + exclude + '&fresh=1');
      items = (resp && resp.items) || [];
    } catch (e) {}
    // 없으면 기존 피드 중 안 본 것 재사용
    const cur = feedOf(t);
    const next = items.length ? items : cur.filter(i => !(state.mutedIds || []).includes(i.id));
    if (next.length){
      liveFeed[t.id] = { items: next.map(i => ({ ...i, rss: true, ago: D.$U.ago(i.pub) })), at: Date.now() };
    } else {
      delete liveFeed[t.id];
    }
    return liveFeed[t.id] ? liveFeed[t.id].items : [];
  }

  /* --- 타일 부분 갱신 (전체 재렌더 없이) --- */
  let _rerenderScheduled = false;
  function rerenderTile(tid){
    const t = state.topics.find(x => x.id === tid);
    if (!t) return;
    const wrap = document.querySelector('#topicTiles');
    if (!wrap) return;
    const el = wrap.querySelector('[data-tid]');
    const tileEl = Array.from(wrap.querySelectorAll('.tile')).find(x => (x.getAttribute('data-tid') || '') === String(tid));
    if (tileEl){ tileEl.outerHTML = D.buildTileHTML(t, payloadOf(t)); bindTileEvents(t.id); }
  }
  function rerenderBriefSafe(){
    // 여러 비동기 완료가 겹쳐도 최종 1회만 브리핑을 다시 그린다
    if (_rerenderScheduled) return;
    _rerenderScheduled = true;
    setTimeout(() => { _rerenderScheduled = false; try { renderBrief(false); } catch (e) {} }, 80);
  }

  /* ============================================================
     위젯 2 : 관심사 — 카드 + 바로 추가 바 (AI가 종류 판단)
     ============================================================ */
  /* 위젯 2 : 관심사 현황 — 등록된 모든 관심사를 실제 데이터 타일로 표시.
     뉴스형(맨시티·비트코인 등)은 각 관심사의 실시간 새 소식을,
     숫자형은 (데모가 아니면) ‘연동 전’ 안내를 보여준다 — 가짜 수치 금지. */
  function bindTileEvents(tid){
    const root = document.querySelector('#topicTiles .tile[data-tid="' + tid + '"]');
    if (!root) return;
    const t = state.topics.find(x => x.id === tid);
    const eb = root.querySelector('.tile-edit');
    if (eb) eb.onclick = () => openTopicEditor(tid);
    const rb = root.querySelector('.tile-refresh');
    if (rb && t){
      rb.onclick = async (ev) => {
        ev.stopPropagation();
        rb.classList.add('spinning');
        try {
          await loadTopicPayload(t, { fresh: true, single: true });
          const p = payloadOf(t);
          let msg = `${t.label} — 최신 데이터를 불러왔어요.`;
          if (p && p.status === 'ok' && p.data){
            const d = p.data;
            if (p.kind === 'stock' || p.kind === 'coin'){
              const up = (d.chgPct || 0) >= 0;
              const sign = up ? '▲' : '▼';
              msg = `${t.label} ${D.$U.fmt(d.price)}원 (${sign}${Math.abs(d.chgPct || 0).toFixed(2)}%) · 최신 시세 반영`;
            } else if (p.kind === 'fx'){
              const up = (d.chgPct || 0) >= 0;
              msg = `${t.label} ${d.price}원 (${up?'▲':'▼'}${Math.abs(d.chgPct||0).toFixed(2)}%) · ${d.cadence==='realtime'?'실시간 호가':'기준환율'} 반영`;
            } else if (p.kind === 'sport'){
              if (d.discipline === 'motorsport' && d.leader){
                msg = `${t.label} — 선두 ${d.leader.name} (${d.leader.points}점) · 다음 ${d.next ? d.next.name : '일정'}`;
              } else if (d.honors && d.honors[0]){
                msg = `${t.label} — ${d.honors[0].title}: ${d.honors[0].name} (${d.honors[0].value})`;
              } else if (d.next){
                msg = `${t.label} — 다음 경기 ${d.next.when || ''} @ ${d.next.venue || ''}`;
              }
            } else if (p.kind === 'news'){
              const items = d.items || [];
              msg = `${t.label} — 최신 기사 ${items.length}건을 확인했어요.`;
            }
          }
          toast({ t: `${t.label} 새로고침 완료`, m: msg, ic: 'i-check', g: ['#22c55e', '#3b82f6'], ms: 2400 });
        } catch (e) {
          toast({ t: `${t.label} 새로고침 실패`, m: '일시적 연결 오류입니다. 잠시 후 다시 시도해 주세요.', ic: 'i-x', ms: 2200 });
        } finally {
          rb.classList.remove('spinning');
        }
      };
    }
  }
  /* ============ 아이폰 스타일 관심사 드래그 앤 드롭 (순서 재배치) ============ */
  function enableTopicTileDragAndDrop(){
    const list = document.querySelector('#topicTiles .mlist');
    if (!list) return;

    list.onpointerdown = (e) => {
      // 버튼 클릭(새로고침, 편집 등) 및 링크는 드래그 시작에서 제외
      if (e.target.closest('button, .icon-btn, input, a')) return;

      const tile = e.target.closest('.tile');
      if (!tile || !tile.dataset.tid) return;

      const startX = e.clientX;
      const startY = e.clientY;
      let isDragging = false;
      let placeholder = null;
      let offsetX = 0;
      let offsetY = 0;
      let initialRect = null;
      const tid = tile.dataset.tid;

      const onPointerMove = (ev) => {
        const dx = ev.clientX - startX;
        const dy = ev.clientY - startY;

        if (!isDragging) {
          // 4px 이상 이동 시 드래그 모드 활성화 (아이폰 햅틱/리프트 효과)
          if (Math.hypot(dx, dy) < 4) return;
          isDragging = true;

          initialRect = tile.getBoundingClientRect();
          offsetX = startX - initialRect.left;
          offsetY = startY - initialRect.top;

          // 플레이스홀더 생성
          placeholder = document.createElement('div');
          placeholder.className = 'tile-placeholder';
          placeholder.style.width = initialRect.width + 'px';
          placeholder.style.height = initialRect.height + 'px';

          // 타일을 최상위 레이어로 띄움
          tile.classList.add('is-dragging');
          tile.style.width = initialRect.width + 'px';
          tile.style.height = initialRect.height + 'px';
          tile.style.left = (ev.clientX - offsetX) + 'px';
          tile.style.top = (ev.clientY - offsetY) + 'px';

          tile.parentNode.insertBefore(placeholder, tile);
          document.body.appendChild(tile);
          list.classList.add('is-reordering');
        }

        if (isDragging) {
          tile.style.left = (ev.clientX - offsetX) + 'px';
          tile.style.top = (ev.clientY - offsetY) + 'px';

          // 마우스 위치에 따른 타일 교체 위치 탐색
          const elemBelow = document.elementFromPoint(ev.clientX, ev.clientY);
          const targetTile = elemBelow && elemBelow.closest('.mlist .tile:not(.is-dragging)');

          if (targetTile && targetTile.parentNode === list) {
            const targetRect = targetTile.getBoundingClientRect();
            const isAfter = (ev.clientY > targetRect.top + targetRect.height / 2) || (ev.clientX > targetRect.left + targetRect.width / 2);
            if (isAfter) {
              list.insertBefore(placeholder, targetTile.nextSibling);
            } else {
              list.insertBefore(placeholder, targetTile);
            }
          }
        }
      };

      const onPointerUp = (ev) => {
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('pointercancel', onPointerUp);

        if (!isDragging) return;

        list.classList.remove('is-reordering');

        if (placeholder && placeholder.parentNode === list) {
          const pRect = placeholder.getBoundingClientRect();
          tile.style.transition = 'all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)';
          tile.style.left = pRect.left + 'px';
          tile.style.top = pRect.top + 'px';
          tile.style.transform = 'scale(1) rotate(0deg)';

          setTimeout(() => {
            tile.classList.remove('is-dragging');
            tile.style.position = '';
            tile.style.zIndex = '';
            tile.style.width = '';
            tile.style.height = '';
            tile.style.left = '';
            tile.style.top = '';
            tile.style.transform = '';
            tile.style.boxShadow = '';
            tile.style.opacity = '';
            tile.style.pointerEvents = '';
            tile.style.transition = '';

            list.insertBefore(tile, placeholder);
            placeholder.remove();

            // DOM 상의 새로운 타일 순서로 state.topics 동기화
            const newOrderTids = [...list.querySelectorAll('.tile')].map(el => el.dataset.tid).filter(Boolean);
            const topicMap = new Map(state.topics.map(t => [t.id, t]));
            const reordered = [];
            newOrderTids.forEach(id => {
              const item = topicMap.get(id);
              if (item) { reordered.push(item); topicMap.delete(id); }
            });
            topicMap.forEach(item => reordered.push(item));

            const orderChanged = reordered.some((t, i) => t.id !== state.topics[i]?.id);
            if (orderChanged) {
              state.topics = reordered;
              save();
              drawBrief(); // 뉴스레터 브리핑 카드 순서도 동기화
              toast({ t: '관심사 순서 변경', m: '관심사 및 뉴스레터 순서를 새 위치로 저장했어요.', ic: 'i-spark', ms: 1600 });
            }
          }, 220);
        } else {
          tile.classList.remove('is-dragging');
          if (placeholder) placeholder.remove();
        }
      };

      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    };
  }

  function renderTopics(){
    const wrap = $('#topicTiles');
    const total = state.topics.length;
    $('#topicCount').textContent = total;                 // 헤더 칩: 전체 관심사 수

    if (!total){
      wrap.innerHTML = `<div class="empty-guide fadeUp">
        ${ic('i-star',30)}
        <div class="eg-title">관심사를 등록해 보세요</div>
        <span class="muted" style="font-size:11px">예: 맨시티 · 비트코인 · 마인크래프트 · 조류 — 각 관심사의 <b>실시간 데이터</b>가 타일·뉴스레터에 표시돼요.</span>
        <button class="btn primary" id="topicsEmptyEdit" style="margin-top:12px">${ic('i-plus',13)} 관심사 추가</button>
      </div>`;

    }

    // 즉시: 현재 payload 상태로 렌더(로딩 스켈레톤/연결 안내 포함) → 비동기 로드 시작
    const tilesHtml = state.topics.map(t => D.buildTileHTML(t, payloadOf(t))).join('');
    wrap.innerHTML = `<div class="mlist">${tilesHtml}</div>`;
    state.topics.forEach(t => bindTileEvents(t.id));
    enableTopicTileDragAndDrop();
